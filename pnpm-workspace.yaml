# The project is its own pnpm workspace root, so pnpm never walks up into a
# parent workspace (e.g. $HOME) when installing.
packages:
  - .

# Allow esbuild's postinstall (binary bootstrap); everything else is pure JS.
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-client-ui-primitives@0.1.1-rc.2 || 0.1.2-alpha.2'
  - '@deepseek-ai/dsh-session@0.1.1-rc.2 || 0.1.2-alpha.2'
  - '@deepseek-ai/dsh-session-projection@0.1.1-rc.2 || 0.1.2-alpha.2'
  - '@deepseek-ai/dsh-settings@0.1.1-rc.2 || 0.1.2-alpha.2'
  - '@deepseek-ai/cosmokit@1.8.3'
  - '@deepseek-ai/dsh-brand@0.1.2-alpha.2'
  - '@deepseek-ai/dsh-llm@0.1.2-alpha.2'
  - '@deepseek-ai/dsh-timeout@0.1.2-alpha.2'
  - '@deepseek-ai/dsh-typert-protocol@0.1.2-alpha.2'
  - '@deepseek-ai/dsh-util-crypto@0.1.2-alpha.2'
  - '@deepseek-ai/dsh-util-values@0.1.2-alpha.2'
  - '@deepseek-ai/schemastery@3.18.2'
