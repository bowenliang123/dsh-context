name: Publish to npm

# Fires on a release tag (v*) push. Publishing uses npm Trusted Publishing
# (OIDC), so no long-lived token is needed — the npm-side trusted publisher
# must be configured with this exact workflow filename.
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the DeeSeek Harness plugin
        uses: bowenliang123/dsh-plugin-checker@v1

      # Reads the pinned pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Bundle smoke
        run: pnpm run test:bundle

      - name: Verify version matches the tag
        run: |
          TAG="${{ github.ref_name }}"
          VER="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag $TAG does not match package version $VER"
            exit 1
          fi

      # Trusted publishing (OIDC) — no NODE_AUTH_TOKEN required; npm >= 11.5.1
      # exchanges the Actions OIDC token for a short-lived publish credential
      # and attaches provenance automatically.
      - name: Publish to npm
        run: npm publish
